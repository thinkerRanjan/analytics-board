services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: analytics-board:latest
    container_name: analytics-board
    ports:
      - "${PORT:-8081}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
      TENANTS_DIR: /app/tenants
      AUTH_SECRET: ${AUTH_SECRET:-dev-compose-secret-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:8081}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-true}
      BIGQUERY_CREDENTIALS_JSON: ${BIGQUERY_CREDENTIALS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COMMENTARY_CACHE_DIR: /tmp/analytics-board-commentary
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
